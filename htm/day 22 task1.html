<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rendered Result</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: white;
    }
    h2 {
      color: blue;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-gap: 20px;
    }
    .box {
      width: 120px;
      height: 120px;
      border-radius: 20px;
    }
    .tan { background-color: tan; }
    .lightblue { background-color: lightblue; }
    .lightgreen { background-color: lightgreen; }
    .darkteal { background-color: teal; }
    .orange { background-color: orange; }
    .lightpurple { background-color: plum; }
  </style>
</head>
<body>
  <h2>RENDERED RESULT</h2>
  <div class="grid">
    <div class="box tan"></div>
    <div class="box lightblue"></div>
    <div class="box lightgreen"></div>
    <div class="box darkteal"></div>
    <div class="box orange"></div>
    <div class="box lightpurple"></div>
  </div>
</body>
</html>
