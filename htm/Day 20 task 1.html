<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: black;
      color: white;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav ul li {
      margin-left: 20px;
    }
    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
    .hero {
      background-color:green;
      text-align: center;
      padding: 80px 20px;
    }
    .hero h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    .hero .btn {
      background-color:blue;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .menu {
      padding: 60px 40px;
      text-align: center;
    }
    .menu h2 {
      margin-bottom: 40px;
      font-size: 2em;
    }
    .menu-items {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .menu-item {
      background-color:white;
      padding: 40px;
      flex: 1;
      border-radius: 8px;
      font-size: 1.2em;
      font-weight: bold;
    }
    footer {
      background-color:black;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Logo</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h1>Delicious Food Starts Here</h1>
    <a href="#" class="btn">Order Now</a>
  </section>

  <section class="menu">
    <h2>OUR SPECIAL MENU</h2>
    <div class="menu-items">
      <div class="menu-item">Food 1</div>
      <div class="menu-item">Food 2</div>
      <div class="menu-item">Food 3</div>
    </div>
  </section>

  <footer>
    FOOTER
  </footer>
</body>
</html>
