<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foodmandu website</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            padding: 10px 70px;
        }
        nav{
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav button{
            background-color: rgb(57, 56, 56);
            color: yellow;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
        }

        /* hero section */
        .hero{
            background-image: url('/foodmandu/images/hero-bg.webp');
            height: 90vh;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <img src="/foodmandu/images/logo-n.png" alt="this is logo" height="35">
            <button>Login</button>
        </nav>
    </header>

    <!-- main section -->

    <main>
        <section class="hero">
            <h1>Order food from the widest range of restaurants.</h1>

            <form>
                <input type="text" name="" id="">
                <input type="button" value="Find Restaurants">
            </form>
        </section>

        <section class="menu">
            
        </section>
    </main>
</body>
</html>
