<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    /* child selector>*/
    div>p{
        color: red;
        font-weight: 600;
        font-size: 32px;
    }
    /*pseudo selector ":"*/
    /*hover */
    div a:hover{
        color: black;
    }
/*descented selector''*/
div article p{
    color: blue;
}
/*multiple selections */
P{
    color:red;
    background:yellow;
    font: size 30px;
    font-weight: 600;
}
</style>
</head>
<body>
    <div class="parent">
        <p>i am a paragraph inside parent </p>
        
        <article>
            <p>i am p inside article</p>
        </article>
        <a href="#"></a>target 
        </div>
    </body>
</html>
