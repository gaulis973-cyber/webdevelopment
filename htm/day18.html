<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Promotional Card</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f8ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        background-color: #e6f2ff;
        width: 300px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        text-align: flex-start;
      }
      .card img {
        width: 100%;
        height: auto;
      }
      .card h2 {
        margin: 10px 0;
        color: #333;
      }
      .card p {
        padding: 0 15px;
        font-size: 14px;
        color: #555;
      }
      .price {
        font-weight: bold;
        margin: 10px 0;
        color: #d32f2f;
      }
      .buy-btn {
        display: inline-block;
        margin: 15px 0;
        padding: 10px 20px;
        background-color: #6a1b9a;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }
      .buy-btn:hover {
        background-color: #8e24aa;
      }
      .name{
    display:flex;  
    align-items:center ; 
    justify-content: space-between; 
      }
    </style>
  </head>
  <body>
    <div>
      <div class="card">
        <img src="https://tse2.mm.bing.net/th/id/OIP.BD9cf1eaFBIVQLMXThVtLgHaE6?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Nature Image" />
        <h2>Nature Image</h2>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quos fuga
          corporis ad quis sint quasi sunt vero et dolor eaque!
        </p>
      </div>
      <div class="name">
        <div class="price">Price: Rs.199</div>
        <a href="#" class="buy-btn">Buy Now</a>
      </div>
    </div>
  </body>
</html>
