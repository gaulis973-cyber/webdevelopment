<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Innovify - Future Ready</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
    }
    header {
      background-color: #fff;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav ul li {
      margin-left: 20px;
    }
    nav ul li a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    .contact-btn {
      background-color: orange;
      color: white;
      padding: 8px 15px;
      border-radius: 4px;
      text-decoration: none;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px 40px;
    }
    .hero-text {
      max-width: 50%;
    }
    .hero-text h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .hero-text p {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .hero-text .start-btn {
      background-color: #007BFF;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 4px;
    }
    .hero-image {
      width: 40%;
      text-align: right;
    }
    .hero-image img {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <h2>Innovify</h2>
    </div>
    <nav>
      <ul>
        <li><a href="#">Work</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Solutions</a></li>
        <li><a href="#">Industry</a></li>
        <li><a href="#">Insights</a></li>
        <li><a href="#" class="contact-btn">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>We Partner with Businesses to be<br>Future Ready</h1>
      <p>Intuitive Experiences. Modern Technologies. Assured Compliance.</p>
      <a href="#" class="start-btn">Start Your Journey</a>
    </div>
    <div class="hero-image">
      <!-- Placeholder for geometric illustration -->
      <img src="lightbulb-placeholder.png" alt="Innovation Illustration">
    </div>
  </section>
</body>
</html>
